[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = paste@localhost

[server:main]
use = egg:Paste#http
host = 0.0.0.0
port = 5000

[app:main]
use = config:../ckan/test-core.ini

# Override test-core.ini localhost addresses with Docker service names
solr_url = http://solr:8983/solr/ckan
sqlalchemy.url = postgresql://ckan:ckan@postgres/ckan_test?sslmode=disable
ckan.redis.url = redis://redis:6379/0

ckan.plugins =
            datavicmain_dataset
            hierarchy
            harvest
            activity
            test_harvester delwp_harvester datavic_dcat_json_harvester
            scheming_datasets
            alias

scheming.dataset_schemas =
                ckanext.datavicmain:iar_ckan_dataset.yaml
scheming.presets =
                ckanext.scheming:presets.json
                ckanext.datavicmain:iar_presets.json
                ckanext.alias:presets.yaml

# datavicmain reads this at import time; set a default so it doesn't crash on load
ckan.pages.base_url = /pages

# Harvest redis queue
ckan.harvest.mq.type = redis
ckan.harvest.mq.hostname = redis
ckan.harvest.mq.redis_db = 0


# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
